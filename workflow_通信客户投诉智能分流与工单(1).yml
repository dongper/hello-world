    - data:
        code: "import json\nimport re\nfrom datetime import datetime, timedelta, timezone\n\
          \n\nINTENTS = {\n    \"BILLING_DISPUTE\",\n    \"MOBILE_NETWORK\",\n   \
          \ \"BROADBAND_FAULT\",\n    \"INSTALL_DELAY\",\n    \"SERVICE_ATTITUDE\"\
          ,\n    \"POSITIVE_FEEDBACK\",\n    \"OTHER\",\n}\n\nFOUR_ACTIVE_INTENTS\
          \ = {\n    \"BILLING_DISPUTE\",\n    \"MOBILE_NETWORK\",\n    \"BROADBAND_FAULT\"\
          ,\n    \"INSTALL_DELAY\",\n}\n\nLEVEL_MAP = {\n    \"普通客户\": \"normal\"\
          ,\n    \"VIP客户\": \"vip\",\n    \"企业客户\": \"enterprise\",\n    \"normal\"\
          : \"normal\",\n    \"vip\": \"vip\",\n    \"enterprise\": \"enterprise\"\
          ,\n}\n\nDEFAULT_PRECEDENCE = {\n    \"BILLING_DISPUTE\": 3,\n    \"MOBILE_NETWORK\"\
          : 1,\n    \"BROADBAND_FAULT\": 1,\n    \"INSTALL_DELAY\": 2,\n    \"SERVICE_ATTITUDE\"\
          : 4,\n    \"POSITIVE_FEEDBACK\": 9,\n    \"OTHER\": 8,\n}\n\nTZ8 = timezone(timedelta(hours=8))\n\
          \n\ndef _s(value):\n    if value is None:\n        return \"\"\n    return\
          \ str(value).strip()\n\n\ndef _as_dict(value):\n    if isinstance(value,\
          \ dict):\n        return value\n    if isinstance(value, str) and value.strip():\n\
          \        try:\n            obj = json.loads(value)\n            return obj\
          \ if isinstance(obj, dict) else {}\n        except Exception:\n        \
          \    return {}\n    return {}\n\n\ndef _extract_json(text):\n    if isinstance(text,\
          \ dict):\n        return text\n    s = _s(text)\n    if not s:\n       \
          \ return {}\n\n    s = re.sub(r\"^```(?:json)?\\s*\", \"\", s, flags=re.I)\n\
          \    s = re.sub(r\"\\s*```$\", \"\", s)\n    try:\n        obj = json.loads(s)\n\
          \        return obj if isinstance(obj, dict) else {}\n    except Exception:\n\
          \        pass\n\n    m = re.search(r\"\\{.*\\}\", s, flags=re.S)\n    if\
          \ m:\n        try:\n            obj = json.loads(m.group(0))\n         \
          \   return obj if isinstance(obj, dict) else {}\n        except Exception:\n\
          \            pass\n    return {}\n\n\ndef _to_float(value):\n    s = _s(value)\n\
          \    if s == \"\" or s.upper() == \"UNKNOWN\":\n        return None\n  \
          \  try:\n        return float(s.replace(\",\", \"\"))\n    except Exception:\n\
          \        return None\n\n\ndef _parse_dt(value):\n    s = _s(value)\n   \
          \ if not s:\n        return None\n    try:\n        dt = datetime.fromisoformat(s)\n\
          \    except Exception:\n        return None\n    if dt.tzinfo is None:\n\
          \        dt = dt.replace(tzinfo=TZ8)\n    return dt\n\n\ndef _add_hours(value,\
          \ hours):\n    # 3.4.4：sla_deadline = received_at + sla_hours，统一输出 +08:00\n\
          \    dt = _parse_dt(value)\n    if dt is None:\n        return \"\"\n  \
          \  try:\n        h = float(hours)\n    except Exception:\n        return\
          \ \"\"\n    result = (dt + timedelta(hours=h)).astimezone(TZ8)\n    return\
          \ result.isoformat(timespec=\"seconds\")\n\n\ndef _level_code(item):\n \
          \   ci = item.get(\"customer_info\")\n    if isinstance(ci, dict):\n   \
          \     code = _s(ci.get(\"customer_level_code\"))\n        if code in (\"\
          normal\", \"vip\", \"enterprise\"):\n            return code\n        raw\
          \ = _s(ci.get(\"customer_level\"))\n        return LEVEL_MAP.get(raw, \"\
          normal\")\n    return \"normal\"\n\n\ndef _load_rules(item, data_json):\n\
          \    rules = []\n    seen = set()\n\n    def add_rule(r):\n        if isinstance(r,\
          \ dict):\n            rid = _s(r.get(\"rule_id\"))\n            if rid and\
          \ rid not in seen:\n                seen.add(rid)\n                rules.append(dict(r))\n\
          \n    for r in item.get(\"rule_candidates\") or []:\n        add_rule(r)\n\
          \n    dj = {}\n    if isinstance(data_json, dict):\n        dj = data_json\n\
          \    elif isinstance(data_json, str) and data_json.strip():\n        try:\n\
          \            dj = json.loads(data_json)\n        except Exception:\n   \
          \         dj = {}\n\n    tables = dj.get(\"tables\") if isinstance(dj, dict)\
          \ else {}\n    if isinstance(tables, dict):\n        for r in tables.get(\"\
          rules\") or []:\n            add_rule(r)\n\n    return rules\n\n\ndef _intent_precedence(intent,\
          \ rules):\n    min_p = None\n    for r in rules:\n        if _s(r.get(\"\
          intent_code\")) != intent:\n            continue\n        try:\n       \
          \     p = int(float(_s(r.get(\"precedence\"))))\n        except Exception:\n\
          \            continue\n        if min_p is None or p < min_p:\n        \
          \    min_p = p\n    if min_p is None:\n        min_p = DEFAULT_PRECEDENCE.get(intent,\
          \ 999)\n    return min_p\n\n\ndef _match_rule(rules, intent, service_type,\
          \ verification_result):\n    # 3.4.1、3.4.2：主意图 + service_type + verification_result\
          \ 匹配；\n    # service_type 为 ANY 时适用；同组合多条取 precedence 最小\n    candidates\
          \ = []\n    for r in rules:\n        if _s(r.get(\"intent_code\")) != intent:\n\
          \            continue\n        rule_st = _s(r.get(\"service_type\"))\n \
          \       if rule_st not in (service_type, \"ANY\"):\n            continue\n\
          \        if _s(r.get(\"verification_result\")) != verification_result:\n\
          \            continue\n        candidates.append(r)\n\n    if not candidates:\n\
          \        return None\n\n    def precedence(rule):\n        try:\n      \
          \      return int(float(_s(rule.get(\"precedence\"))))\n        except Exception:\n\
          \            return 999\n\n    return min(candidates, key=precedence)\n\n\
          \ndef _identity_issues(item, intent):\n    issues = []\n    customer_id\
          \ = _s(item.get(\"customer_id\"))\n    service_id = _s(item.get(\"service_id\"\
          ))\n    service_type = _s(item.get(\"service_type\"))\n    region = _s(item.get(\"\
          region\"))\n\n    if not customer_id:\n        issues.append(\"缺少客户号\")\n\
          \    if not service_id:\n        issues.append(\"缺少业务号码\")\n\n    ci = item.get(\"\
          customer_info\")\n    if not isinstance(ci, dict) or not ci:\n        issues.append(\"\
          客户主档不存在该 customer_id\")\n\n    snap = item.get(\"snapshot\")\n    if not\
          \ isinstance(snap, dict) or not snap:\n        issues.append(\"不存在该业务号码对应的业务快照\"\
          )\n    else:\n        if _s(snap.get(\"customer_id\")) != customer_id:\n\
          \            issues.append(\"快照 customer_id 与诉求不一致\")\n        if _s(snap.get(\"\
          service_type\")) != service_type:\n            issues.append(\"快照 service_type\
          \ 与诉求不一致\")\n        if _s(snap.get(\"region\")) != region:\n          \
          \  issues.append(\"快照 region 与诉求不一致\")\n        if _s(snap.get(\"service_id\"\
          )) != service_id:\n            issues.append(\"快照 service_id 与诉求业务号码不一致\"\
          )\n        if intent in FOUR_ACTIVE_INTENTS and _s(snap.get(\"account_status\"\
          )) != \"ACTIVE\":\n            issues.append(\"账户非 ACTIVE\")\n\n    return\
          \ issues\n\n\ndef _verification_result(intent, snapshot, identity_ok):\n\
          \    if intent == \"POSITIVE_FEEDBACK\":\n        return \"NOT_REQUIRED\"\
          \n    if intent in (\"SERVICE_ATTITUDE\", \"OTHER\"):\n        return \"\
          NOT_CHECKED\"\n    if not identity_ok:\n        return \"UNKNOWN\"\n   \
          \ if not isinstance(snapshot, dict):\n        return \"UNKNOWN\"\n\n   \
          \ if intent == \"BILLING_DISPUTE\":\n        contract = _to_float(snapshot.get(\"\
          contract_monthly_fee_yuan\"))\n        charged = _to_float(snapshot.get(\"\
          charged_monthly_fee_yuan\"))\n        if contract is None or charged is\
          \ None:\n            return \"UNKNOWN\"\n        return \"CONFIRMED\" if\
          \ charged > contract else \"NOT_CONFIRMED\"\n\n    if intent == \"MOBILE_NETWORK\"\
          :\n        status = _s(snapshot.get(\"network_incident_status\")).upper()\n\
          \        if status == \"OPEN\":\n            return \"CONFIRMED\"\n    \
          \    if status == \"NONE\":\n            return \"NOT_CONFIRMED\"\n    \
          \    return \"UNKNOWN\"\n\n    if intent == \"BROADBAND_FAULT\":\n     \
          \   status = _s(snapshot.get(\"access_line_status\")).upper()\n        if\
          \ status == \"DOWN\":\n            return \"CONFIRMED\"\n        if status\
