    - data:
        code: "import json\nfrom datetime import datetime, timezone, timedelta\n\n\
          \n# ============================================================\n# 策略计算节点（循环体内，每次处理一个时段）\n\
          # 输入: data_json, loop_index, state_json, result_rows_json, slot_summaries_text\n\
          # 输出: next_loop_index, updated_state_json, updated_result_rows_json,\n#\
          \       current_slot_summary, updated_slot_summaries_text\n# ============================================================\n\
          \n\ndef _to_float(v, default=0.0):\n    try:\n        if v is None or v\
          \ == \"\":\n            return default\n        return float(v)\n    except\
          \ Exception:\n        return default\n\n\ndef _to_int(v, default=0):\n \
          \   try:\n        if v is None or v == \"\":\n            return default\n\
          \        return int(float(v))\n    except Exception:\n        return default\n\
          \n\ndef _get_rule(rule_by_key, key, default=None):\n    r = rule_by_key.get(key)\n\
          \    if r is None:\n        return default\n    return r.get(\"value\",\
          \ default)\n\n\ndef _get_power(power_by_model_state, model_id, state):\n\
          \    key = f\"{model_id}|{state}\"\n    p = power_by_model_state.get(key)\n\
          \    if p is None:\n        return {\"capacity_units\": 0.0, \"base_power_w\"\
          : 0.0, \"slope_w_per_unit\": 0.0}\n    return p\n\n\ndef _is_force_active_overlap(restrictions,\
          \ slot_start_ts, slot_end_ts):\n    \"\"\"临时保障限制与当前时段是否重叠。\"\"\"\n    if\
          \ slot_start_ts is None or slot_end_ts is None:\n        return False\n\
          \    for r in restrictions:\n        if str(r.get(\"restriction_type\",\
          \ \"\")).upper() != \"FORCE_ACTIVE\":\n            continue\n        rs\
          \ = r.get(\"start_ts\")\n        re_ = r.get(\"end_ts\")\n        if rs\
          \ is None or re_ is None:\n            continue\n        if rs < slot_end_ts\
          \ and re_ > slot_start_ts:\n            return True\n    return False\n\n\
          \ndef _can_receive(target_cid, cell_by_cell_id, processed, new_state):\n\
          \    \"\"\"\n    承接方是否可接收业务：\n      - ANCHOR：始终可\n      - 未处理 BOOSTER：可\n\
          \      - 已处理 KEEP_ACTIVE BOOSTER：可\n      - 已处理 LIGHT_SLEEP/DEEP_SLEEP：不可\n\
          \    \"\"\"\n    t_cell = cell_by_cell_id.get(target_cid, {})\n    role\
          \ = str(t_cell.get(\"role\", \"\")).upper()\n    if role == \"ANCHOR\":\n\
          \        return True\n    if target_cid not in processed:\n        return\
          \ True\n    return new_state.get(target_cid) == \"KEEP_ACTIVE\"\n\n\ndef\
          \ main(\n    data_json: str,\n    loop_index: int,\n    state_json: str,\n\
          \    result_rows_json: str,\n    slot_summaries_text: str,\n) -> dict:\n\
          \    try:\n        data = json.loads(data_json) if data_json else {}\n \
          \       state = json.loads(state_json) if state_json else {}\n        result_rows\
          \ = json.loads(result_rows_json) if result_rows_json else []\n        summaries\
          \ = slot_summaries_text or \"\"\n\n        normalized = data.get(\"normalized\"\
          , {})\n        index = data.get(\"index\", {})\n\n        tasks = normalized.get(\"\
          task\", [])\n        cells = normalized.get(\"cell\", [])\n        traffic\
          \ = normalized.get(\"traffic\", [])\n\n        if not tasks:\n         \
          \   raise ValueError(\"normalized.task 为空\")\n\n        loop_index = _to_int(loop_index,\
          \ 0)\n        total_slots = len(tasks)\n\n        # ---------- 循环已结束 ----------\n\
          \        if loop_index >= total_slots:\n            return {\n         \
          \       \"next_loop_index\": loop_index,\n                \"updated_state_json\"\
          : state_json,\n                \"updated_result_rows_json\": result_rows_json,\n\
          \                \"current_slot_summary\": \"所有时段已处理完成\",\n            \
          \    \"updated_slot_summaries_text\": summaries,\n            }\n\n    \
          \    # ---------- 取当前时段 ----------\n        task = tasks[loop_index]\n \
          \       slot_id = task.get(\"slot_id\")\n        start_time = task.get(\"\
          start_time\")\n        end_time = task.get(\"end_time\")\n        start_ts\
          \ = task.get(\"start_ts\")\n        end_ts = task.get(\"end_ts\")\n    \
          \    duration_hours = _to_float(task.get(\"duration_hours\"), 0.0)\n\n \
          \       # slot_id 为 null 时，从 traffic 提取唯一 slot_id 排序后按 loop_index 取\n  \
          \      if slot_id is None:\n            all_slots = []\n            seen\
          \ = set()\n            for tr in traffic:\n                sid = tr.get(\"\
          slot_id\")\n                if sid is not None and sid not in seen:\n  \
          \                  seen.add(sid)\n                    all_slots.append(sid)\n\
          \            try:\n                all_slots.sort(key=lambda x: float(x))\n\
          \            except Exception:\n                all_slots.sort(key=lambda\
          \ x: str(x))\n            if loop_index < len(all_slots):\n            \
          \    slot_id = all_slots[loop_index]\n\n        # ---------- 规则 ----------\n\
          \        rule_by_key = index.get(\"rule_by_key\", {})\n        deep_load_ratio_max\
          \ = _to_float(_get_rule(rule_by_key, \"deep_load_ratio_max\", 0.2), 0.2)\n\
          \        light_load_ratio_max = _to_float(_get_rule(rule_by_key, \"light_load_ratio_max\"\
          , 0.55), 0.55)\n        max_util = _to_float(_get_rule(rule_by_key, \"max_utilization_ratio\"\
          , 0.85), 0.85)\n        max_consec_deep = _to_int(_get_rule(rule_by_key,\
          \ \"max_consecutive_deep_slots\", 2), 2)\n        switch_wh = _to_float(_get_rule(rule_by_key,\
          \ \"switch_energy_wh\", 8), 8.0)\n        min_saving = _to_float(_get_rule(rule_by_key,\
          \ \"minimum_incremental_saving_wh\", 5), 5.0)\n\n        # ---------- 索引\
          \ ----------\n        cell_by_cell_id = index.get(\"cell_by_cell_id\", {})\n\
          \        traffic_by_slot_cell = index.get(\"traffic_by_slot_cell\", {})\n\
          \        transfer_by_source = index.get(\"transfer_by_source\", {})\n  \
          \      power_by_model_state = index.get(\"power_by_model_state\", {})\n\
          \        restriction_by_cell = index.get(\"restriction_by_cell\", {})\n\
          \        coverage_by_group = index.get(\"coverage_by_group\", {})\n\n  \
          \      cell_ids = sorted([str(c.get(\"cell_id\")) for c in cells if c.get(\"\
          cell_id\")])\n\n        # ---------- 原始业务量 / 当前业务量 ----------\n        original\
          \ = {}\n        for cid in cell_ids:\n            key = f\"{slot_id}|{cid}\"\
          \ if slot_id is not None else \"\"\n            tr = traffic_by_slot_cell.get(key)\n\
          \            original[cid] = _to_float(tr.get(\"demand_units\") if tr else\
          \ 0, 0.0)\n\n        current = dict(original)\n        transfer_in = {cid:\
