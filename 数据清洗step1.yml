    - data:
        code: "import json\nimport re\nimport datetime\n\n\nMONTH_MAP = {\n    \"\
          jan\": 1, \"january\": 1,\n    \"feb\": 2, \"february\": 2,\n    \"mar\"\
          : 3, \"march\": 3,\n    \"apr\": 4, \"april\": 4,\n    \"may\": 5,\n   \
          \ \"jun\": 6, \"june\": 6,\n    \"jul\": 7, \"july\": 7,\n    \"aug\": 8,\
          \ \"august\": 8,\n    \"sep\": 9, \"sept\": 9, \"september\": 9,\n    \"\
          oct\": 10, \"october\": 10,\n    \"nov\": 11, \"november\": 11,\n    \"\
          dec\": 12, \"december\": 12,\n}\n\n\ndef _valid_dt(y, mo, d, H, M):\n  \
