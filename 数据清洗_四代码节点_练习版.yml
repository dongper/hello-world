          )\n\n\ndef unpack(value):\n    return json.loads(zlib.decompress(base64.b64decode(value)).decode(\"utf-8\"))\n\n\
          \ndef blank(value):\n    return value is None or str(value).strip() == \"\"\n\n\nimport re\n\n\nMARKERS = {\"complaint_id\"\
          : \"该条投诉号记录丢失\", \"accept_time\": \"该条时间记录丢失\", \"customer_id\": \"该条客户记录丢失\", \"customer_name\": \"该条客户记录丢失\",\
          \ \"handler_id\": \"该条员工记录丢失\", \"handler_name\": \"该条员工记录丢失\", \"hall_id\": \"该条营业厅记录丢失\", \"package_type\": \"\
          该条套餐记录丢失\", \"complaint_type\": \"该条投诉类型记录丢失\", \"complaint_subtype\": \"该条投诉子类记录丢失\", \"customer_feedback\": \"\
          该条反馈记录丢失\"}\n\n\ndef unique_lookup(rows, key, value):\n    index = {}\n    for row in rows:\n        k, v = row.get(key,\
          \ \"\"), row.get(value, \"\")\n        if not blank(k) and not blank(v):\n            index.setdefault(k, set()).add(v)\n\
          \    return index\n\n\ndef fill_from_index(row, target, key_value, index, label, report):\n    if not blank(row[target])\
          \ or blank(key_value):\n        return\n    matches = index.get(key_value, set())\n    if len(matches) == 1:\n \
          \       row[target] = next(iter(matches))\n        report[\"filled_from_master\"] += 1\n    elif len(matches) >\
          \ 1:\n        report[\"name_conflicts\"].append({\"source_row_index\": row[\"source_row_index\"], \"field\": target,\
          \ \"name\": key_value, \"kind\": label})\n\n\ndef md_table(table):\n    columns = table[\"columns\"]\n    def cell(value):\n\
          \        return str(value).replace(\"|\", \"\\\\|\").replace(\"\\r\", \" \").replace(\"\\n\", \"<br>\")\n    lines\
          \ = [\"| \" + \" | \".join(columns) + \" |\", \"| \" + \" | \".join([\"---\"] * len(columns)) + \" |\"]\n    lines.extend(\"\
          | \" + \" | \".join(cell(row.get(col, \"\")) for col in columns) + \" |\" for row in table[\"rows\"])\n    return\
          \ \"\\n\".join(lines) + \"\\n\"\n\n\ndef main(record, handling, customer, employee, hall, stats):\n    tables =\
          \ {name: unpack(value) for name, value in ((\"record\", record), (\"handling\", handling), (\"customer\", customer),\
          \ (\"employee\", employee), (\"hall\", hall))}\n    report = unpack(stats)\n    rec = tables[\"record\"][\"rows\"\
          ]\n    hand = tables[\"handling\"][\"rows\"]\n    if len(rec) != len(hand):\n        raise ValueError(\"投诉表行数不一致\"\
          )\n    pairs = []\n    removed = []\n    for r, h in zip(rec, hand):\n        if r[\"source_row_index\"] != h[\"\
          source_row_index\"]:\n            raise ValueError(\"投诉表 source_row_index 未对齐\")\n        if blank(r[\"complaint_description\"\
          ]):\n            removed.append(r[\"source_row_index\"])\n        else:\n            pairs.append((r, h))\n    tables[\"\
          record\"][\"rows\"] = [r for r, _ in pairs]\n    tables[\"handling\"][\"rows\"] = [h for _, h in pairs]\n    report.update({\"\
          deleted_count\": len(removed), \"deleted_source_row_indexes\": removed, \"kept_count\": len(pairs), \"cross_table_fills\"\
          : 0, \"sequence_fills\": 0, \"filled_from_master\": 0, \"name_conflicts\": [], \"unresolved_counts\": {}})\n   \
          \ for r, h in pairs:\n        for field in (\"complaint_id\", \"accept_time\"):\n            if blank(r[field])\
          \ and not blank(h[field]):\n                r[field] = h[field]; report[\"cross_table_fills\"] += 1\n          \
          \  elif blank(h[field]) and not blank(r[field]):\n                h[field] = r[field]; report[\"cross_table_fills\"\
          ] += 1\n    # 仅当两侧已知投诉号的行号差恰好等于编号差时，补齐其中空白段。\n    known = []\n    for pos, (r, h) in enumerate(pairs):\n       \
          \ m = re.fullmatch(r\"TS(\\d{10})\", str(r[\"complaint_id\"]))\n        if m:\n            known.append((pos, r[\"\
          source_row_index\"], int(m.group(1)), m.group(1)[:6]))\n    for left, right in zip(known, known[1:]):\n        lp,\
          \ li, ln, lm = left\n        rp, ri, rn, rm = right\n        if lm != rm or ri - li != rn - ln:\n            continue\n\
          \        for pos in range(lp + 1, rp):\n            r, h = pairs[pos]\n            if blank(r[\"complaint_id\"])\
          \ and blank(h[\"complaint_id\"]):\n                value = \"TS\" + str(ln + r[\"source_row_index\"] - li).zfill(10)\n\
          \                r[\"complaint_id\"] = value; h[\"complaint_id\"] = value\n                report[\"sequence_fills\"\
          ] += 2\n    customers = tables[\"customer\"][\"rows\"]\n    employees = tables[\"employee\"][\"rows\"]\n    customer_by_name\
          \ = unique_lookup(customers, \"customer_name\", \"customer_id\")\n    customer_by_id = unique_lookup(customers,\
          \ \"customer_id\", \"customer_name\")\n    employee_by_name = unique_lookup(employees, \"handler_name\", \"handler_id\"\
          )\n    employee_by_id = unique_lookup(employees, \"handler_id\", \"handler_name\")\n    for r, h in pairs:\n   \
          \     fill_from_index(r, \"customer_id\", h[\"customer_name\"], customer_by_name, \"客户\", report)\n        fill_from_index(h,\
          \ \"handler_id\", r[\"handler_name\"], employee_by_name, \"员工\", report)\n        fill_from_index(r, \"handler_name\"\
          , h[\"handler_id\"], employee_by_id, \"员工\", report)\n        fill_from_index(h, \"customer_name\", r[\"customer_id\"\
          ], customer_by_id, \"客户\", report)\n        for name, row in ((\"record\", r), (\"handling\", h)):\n           \
          \ for field in tables[name][\"columns\"]:\n                if field == \"source_row_index\" or not blank(row[field]):\n\
          \                    continue\n                marker = MARKERS.get(field, \"该条\" + field + \"记录丢失\")\n        \
          \        row[field] = marker\n                key = name + \".\" + field\n                report[\"unresolved_counts\"\
          ][key] = report[\"unresolved_counts\"].get(key, 0) + 1\n    markdown = {name: md_table(table) for name, table in\
          \ tables.items()}\n    report_text = \"# 数据清洗变更报告\\n\\n\"\n    report_text += \"| 项目 | 结果 |\\n| --- | ---: |\\n\"\
          \n    for name in (\"record\", \"handling\", \"customer\", \"employee\", \"hall\"):\n        report_text += \"|\
          \ %s 原始行数 | %d |\\n\" % (name, len(tables[name][\"rows\"]) + (len(removed) if name in (\"record\", \"handling\"\
          ) else 0))\n    report_text += \"| 删除投诉及对应处理记录 | %d |\\n| 两张投诉表各保留 | %d |\\n\" % (len(removed), len(pairs))\n  \
          \  for name in (\"record\", \"handling\"):\n        report_text += \"| %s 时间修复 | %d |\\n\" % (name, report[\"time_repairs\"\
          ][name])\n    for name, count in report[\"id_repairs\"].items():\n        report_text += \"| %s ID 单元格修复 | %d |\\\
          n\" % (name, count)\n    report_text += \"| 跨表补值单元格 | %d |\\n| 行序推定投诉号单元格 | %d |\\n| 主表匹配补值单元格 | %d |\\n\" % (report[\"\
          cross_table_fills\"], report[\"sequence_fills\"], report[\"filled_from_master\"])\n    report_text += \"\\n## 缺失标记数量\\\
          n\\n| 字段 | 数量 |\\n| --- | ---: |\\n\"\n    for field, count in sorted(report[\"unresolved_counts\"].items()):\n\
          \        report_text += \"| %s | %d |\\n\" % (field, count)\n    report_text += \"\\n## 待核查问题\\n\\n时间异常 %d 项；ID\
          \ 异常 %d 项；姓名多候选 %d 项。详情见运行输出 stats。\\n\" % (len(report[\"time_issues\"]), len(report[\"id_issues\"]), len(report[\"\
          name_conflicts\"]))\n    # 单个 Dify 代码节点文本输出常见上限为 80000 字符；分段给后续文件工具拼接。\n    limits = {\"record\": 6, \"handling\"\
          : 6, \"customer\": 3, \"employee\": 2, \"hall\": 2}\n    result = {\"report\": report_text, \"stats\": pack(report)}\n\
          \    for name, text in markdown.items():\n        parts = [text[i:i + 45000] for i in range(0, len(text), 45000)]\n\
          \        if len(parts) > limits[name]:\n            raise ValueError(name + \" 结果超过预设分段容量，请增加输出分段\")\n        for\
          \ i in range(limits[name]):\n            result[\"%s_%02d\" % (name, i + 1)] = parts[i] if i < len(parts) else \"\
          \"\n    return result\n"
