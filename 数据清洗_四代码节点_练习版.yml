    - data:
        code: "import base64\nimport json\nimport zlib\n\n\ndef pack(value):\n    raw = json.dumps(value, ensure_ascii=False,\
          \ separators=(\",\", \":\")).encode(\"utf-8\")\n    return base64.b64encode(zlib.compress(raw, 9)).decode(\"ascii\"\
          )\n\n\ndef unpack(value):\n    return json.loads(zlib.decompress(base64.b64decode(value)).decode(\"utf-8\"))\n\n\
          \ndef blank(value):\n    return value is None or str(value).strip() == \"\"\n\n\nimport csv\nimport io\n\n\nSPECS\
          \ = {\n    \"record\": ([\"complaint_id\", \"accept_time\", \"customer_id\", \"handler_name\", \"package_type\"\
          , \"complaint_description\", \"complaint_type\", \"complaint_subtype\"], {\"投诉id\": \"complaint_id\", \"客户编号\":\
          \ \"customer_id\", \"员工姓名\": \"handler_name\"}),\n    \"handling\": ([\"complaint_id\", \"handler_id\", \"hall_id\"\
          , \"accept_time\", \"customer_feedback\", \"customer_name\"], {\"投诉id\": \"complaint_id\", \"handler_ID\": \"handler_id\"\
          , \"营业厅ID\": \"hall_id\"}),\n    \"customer\": ([\"customer_id\", \"customer_name\", \"customer_level\"], {\"客户id\"\
          : \"customer_id\"}),\n    \"employee\": ([\"handler_id\", \"handler_name\", \"hall_id\"], {\"员工ID\": \"handler_id\"\
          }),\n    \"hall\": ([\"hall_id\", \"hall_name\", \"region\"], {\"hall_ID\": \"hall_id\", \"营业厅名称\": \"hall_name\"\
          }),\n}\n\n\ndef parse_table(text, name):\n    if blank(text):\n        raise ValueError(name + \" 文件内容为空\")\n  \
          \  text = str(text).lstrip(\"\\ufeff\")\n    lines = [line for line in text.splitlines() if line.strip()]\n    if\
          \ not lines:\n        raise ValueError(name + \" 无数据\")\n    if lines[0].strip().startswith(\"|\"):\n        rows\
          \ = []\n        for line in lines:\n            if not line.strip().startswith(\"|\"):\n                continue\n\
          \            cells = [x.strip().replace(\"\\\\|\", \"|\") for x in line.strip().strip(\"|\").split(\"|\")]\n   \
          \         if all(x.replace(\":\", \"\").replace(\"-\", \"\").strip() == \"\" for x in cells):\n                continue\n\
          \            rows.append(cells)\n    else:\n        rows = list(csv.reader(io.StringIO(text)))\n        rows = [row\
          \ for row in rows if any(x != \"\" for x in row)]\n    if not rows:\n        raise ValueError(name + \" 无表头\")\n\
          \    headers = [x.lstrip(\"\\ufeff\").strip() for x in rows[0]]\n    standard, aliases = SPECS[name]\n    aliases\
          \ = {**{x: x for x in standard}, **aliases}\n    aliases.update({\"handler_id\": \"handler_id\", \"hall_id\": \"\
          hall_id\", \"customer_id\": \"customer_id\", \"complaint_id\": \"complaint_id\"})\n    normalized = [aliases.get(x,\
          \ aliases.get(x.lower(), x)) for x in headers]\n    if len(set(normalized)) != len(normalized):\n        raise ValueError(name\
          \ + \" 统一列名后出现重复列\")\n    missing = [x for x in standard if x not in normalized]\n    if missing:\n        raise\
          \ ValueError(name + \" 缺少列：\" + \",\".join(missing))\n    extra = [x for x in normalized if x not in standard and\
          \ x != \"source_row_index\"]\n    columns = standard + extra + [\"source_row_index\"]\n    out = []\n    for idx,\
          \ values in enumerate(rows[1:]):\n        if len(values) != len(headers):\n            raise ValueError(\"%s 第 %d\
          \ 行列数不符\" % (name, idx + 2))\n        original = dict(zip(normalized, values))\n        item = {col: original.get(col,\
          \ \"\") for col in columns if col != \"source_row_index\"}\n        item[\"source_row_index\"] = idx\n        out.append(item)\n\
          \    return {\"columns\": columns, \"rows\": out}\n\n\ndef main(record_text, handling_text, customer_text, employee_text,\
          \ hall_text):\n    inputs = {\"record\": record_text, \"handling\": handling_text, \"customer\": customer_text,\
          \ \"employee\": employee_text, \"hall\": hall_text}\n    tables = {name: parse_table(inputs[name], name) for name\
          \ in SPECS}\n    if len(tables[\"record\"][\"rows\"]) != len(tables[\"handling\"][\"rows\"]):\n        raise ValueError(\"\
          两张投诉表行数不同，不能按 source_row_index 对齐\")\n    return {name: pack(table) for name, table in tables.items()}\n"
