          \ x: x.get(\"start_ts\") or 0)\n\n        rule_by_key = {}\n        for\
          \ r in rules:\n            key = r.get(\"rule_key\")\n            if key\
          \ is not None:\n                rule_by_key[str(key)] = r\n\n        traffic_total\
          \ = sum(t[\"demand_units\"] for t in traffic\n                         \
          \   if isinstance(t.get(\"demand_units\"), (int, float)))\n        transfer_total\
          \ = sum(t[\"max_transfer_units\"] for t in transfer\n                  \
          \           if isinstance(t.get(\"max_transfer_units\"), (int, float)))\n\
          \n        meta = {\n            \"counts\": {\n                \"task\"\
          : len(tasks), \"cell\": len(cells), \"traffic\": len(traffic),\n       \
