    - data:
        code: "import csv\nimport io\nimport re\nimport json\n\n\nRECORD_STANDARD\
          \ = [\n    \"complaint_id\",\n    \"accept_time\",\n    \"customer_id\"\
          ,\n    \"handler_name\",\n    \"package_type\",\n    \"complaint_description\"\
          ,\n    \"complaint_type\",\n    \"complaint_subtype\",\n]\n\nHANDLING_STANDARD\
          \ = [\n    \"complaint_id\",\n    \"handler_id\",\n    \"hall_id\",\n  \
          \  \"accept_time\",\n    \"customer_feedback\",\n    \"customer_name\",\n\
          ]\n\nCUSTOMER_STANDARD = [\n    \"customer_id\",\n    \"customer_name\"\
          ,\n    \"customer_level\",\n]\n\nEMPLOYEE_STANDARD = [\n    \"handler_id\"\
          ,\n    \"handler_name\",\n    \"hall_id\",\n]\n\nHALL_STANDARD = [\n   \
          \ \"hall_id\",\n    \"hall_name\",\n    \"region\",\n]\n\n\nHEADER_MAP =\
          \ {\n    # complaint_record\n    \"complaint_id\": \"complaint_id\",\n \
          \   \"投诉id\": \"complaint_id\",\n    \"accept_time\": \"accept_time\",\n\
          \    \"customer_id\": \"customer_id\",\n    \"客户编号\": \"customer_id\",\n\
          \    \"客户id\": \"customer_id\",\n    \"handler_name\": \"handler_name\"\
          ,\n    \"员工姓名\": \"handler_name\",\n    \"package_type\": \"package_type\"\
          ,\n    \"complaint_description\": \"complaint_description\",\n    \"complaint_type\"\
          : \"complaint_type\",\n    \"complaint_subtype\": \"complaint_subtype\"\
          ,\n\n    # complaint_handling\n    \"handler_id\": \"handler_id\",\n   \
          \ \"员工id\": \"handler_id\",\n    \"hall_id\": \"hall_id\",\n    \"营业厅id\"\
          : \"hall_id\",\n    \"customer_feedback\": \"customer_feedback\",\n    \"\
          customer_name\": \"customer_name\",\n\n    # customer_info\n    \"customer_level\"\
          : \"customer_level\",\n\n    # hall_info\n    \"hall_name\": \"hall_name\"\
          ,\n    \"营业厅名称\": \"hall_name\",\n    \"region\": \"region\",\n}\n\n\ndef\
          \ _is_markdown_separator(line: str) -> bool:\n    s = line.strip()\n   \
          \ if \"|\" not in s:\n        return False\n    if \"-\" not in s:\n   \
          \     return False\n    return all(ch in \"|-: \" for ch in s)\n\n\ndef\
          \ _split_markdown_row(line: str):\n    s = line.strip()\n    if s.startswith(\"\
          |\"):\n        s = s[1:]\n    if s.endswith(\"|\"):\n        s = s[:-1]\n\
          \    return [cell.strip() for cell in s.split(\"|\")]\n\n\ndef _read_table(text:\
          \ str):\n    \"\"\"\n    返回 (headers_raw, data_rows)\n    兼容 Markdown 表格与\
          \ CSV 文本。\n    \"\"\"\n    if text is None:\n        text = \"\"\n    text\
          \ = str(text).replace(\"\\ufeff\", \"\")\n\n    lines = text.splitlines()\n\
          \n    # 优先识别 Markdown 表格：表头行 + 分隔行\n    for i in range(len(lines) - 1):\n\
          \        if \"|\" in lines[i] and _is_markdown_separator(lines[i + 1]):\n\
          \            headers = _split_markdown_row(lines[i])\n            data_rows\
          \ = []\n            for line in lines[i + 2:]:\n                if not line.strip():\n\
          \                    break\n                if \"|\" not in line:\n    \
          \                break\n                data_rows.append(_split_markdown_row(line))\n\
          \            return headers, data_rows\n\n    # 回退 CSV\n    reader = csv.reader(io.StringIO(text))\n\
          \    rows = []\n    for row in reader:\n        if row is None:\n      \
          \      continue\n        if len(row) == 0:\n            continue\n     \
          \   if all(str(cell).strip() == \"\" for cell in row):\n            continue\n\
          \        rows.append([str(cell) for cell in row])\n\n    if not rows:\n\
          \        return [], []\n\n    return rows[0], rows[1:]\n\n\ndef _normalize_header(header:\
          \ str) -> str:\n    h = str(header).replace(\"\\ufeff\", \"\").strip().lower()\n\
          \n    if h in HEADER_MAP:\n        return HEADER_MAP[h]\n\n    h = re.sub(r\"\
          [\\s\\-]+\", \"_\", h)\n    h = re.sub(r\"_+\", \"_\", h).strip(\"_\")\n\
          \    return h\n\n\ndef _parse_table(text: str, standard_columns):\n    headers_raw,\
          \ data_rows = _read_table(text)\n\n    if not headers_raw:\n        return\
          \ []\n\n    # 如果数据行比表头多列，扩展额外列名，避免丢值\n    max_len = len(headers_raw)\n \
          \   for row in data_rows:\n        if len(row) > max_len:\n            max_len\
          \ = len(row)\n\n    if max_len > len(headers_raw):\n        headers_raw\
          \ = list(headers_raw) + [\n            f\"extra_col_{i + 1}\" for i in range(len(headers_raw),\
          \ max_len)\n        ]\n\n    mapped_headers = []\n    seen = set()\n\n \
          \   for idx, raw_header in enumerate(headers_raw):\n        mapped = _normalize_header(raw_header)\n\
          \        if not mapped:\n            mapped = f\"column_{idx + 1}\"\n\n\
          \        base = mapped\n        n = 2\n        while mapped in seen:\n \
          \           mapped = f\"{base}_{n}\"\n            n += 1\n\n        seen.add(mapped)\n\
          \        mapped_headers.append(mapped)\n\n    result = []\n\n    for source_row_index,\
          \ row in enumerate(data_rows):\n        row = list(row) + [\"\"] * (len(mapped_headers)\
          \ - len(row))\n        raw_map = dict(zip(mapped_headers, row))\n\n    \
          \    out = {}\n\n        # 标准字段按固定顺序\n        for col in standard_columns:\n\
          \            out[col] = raw_map.get(col, \"\")\n\n        # 额外字段放在标准字段之后、source_row_index\
          \ 之前\n        for col in mapped_headers:\n            if col not in standard_columns\
          \ and col != \"source_row_index\":\n                out[col] = raw_map.get(col,\
          \ \"\")\n\n        # 原始行序索引\n        out[\"source_row_index\"] = source_row_index\n\
          \n        result.append(out)\n\n    return result\n\n\ndef _to_json_str(rows)\
          \ -> str:\n    \"\"\"\n    输出为 str 类型：JSON 字符串。\n    保留中文，不转义。\n    \"\"\
          \"\n    return json.dumps(rows, ensure_ascii=False, separators=(\",\", \"\
          :\"))\n\n\ndef main(\n    record_text: str,\n    handling_text: str,\n \
          \   customer_text: str,\n    employee_text: str,\n    hall_text: str,\n\
          ) -> dict:\n    complaint_record = _parse_table(record_text, RECORD_STANDARD)\n\
          \    complaint_handling = _parse_table(handling_text, HANDLING_STANDARD)\n\
          \    customer_info = _parse_table(customer_text, CUSTOMER_STANDARD)\n  \
          \  employee_info = _parse_table(employee_text, EMPLOYEE_STANDARD)\n    hall_info\
          \ = _parse_table(hall_text, HALL_STANDARD)\n\n    return {\n        \"complaint_record\"\
          : _to_json_str(complaint_record),\n        \"complaint_handling\": _to_json_str(complaint_handling),\n\
          \        \"customer_info\": _to_json_str(customer_info),\n        \"employee_info\"\
          : _to_json_str(employee_info),\n        \"hall_info\": _to_json_str(hall_info),\n\
          \    }"
        code_language: python3
        outputs:
