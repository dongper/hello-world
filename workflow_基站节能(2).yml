          \            \"cell_count\": len(cells),\n            \"traffic_total_demand\"\
          : traffic_total,\n            \"transfer_total_max_units\": transfer_total,\n\
          \            \"anchor_cell_count\": len(anchor_cell_ids),\n            \"\
          booster_cell_count\": len(booster_cell_ids),\n            \"slot_id_fix\"\
          : fix_info,\n        }\n\n        data = {\n            \"normalized\":\
          \ {\n                \"task\": tasks, \"cell\": cells, \"traffic\": traffic,\n\
          \                \"coverage\": coverage, \"transfer\": transfer, \"power\"\
          : power,\n                \"restriction\": restrictions, \"rule\": rules,\n\
          \            },\n            \"index\": {\n                \"task_by_case_id\"\
          : task_by_case_id,\n                \"tasks_by_case_id\": tasks_by_case_id,\n\
          \                \"task_by_slot_id\": task_by_slot_id,\n               \
          \ \"cell_by_cell_id\": cell_by_cell_id,\n                \"cell_by_coverage_group\"\
          : cell_by_coverage_group,\n                \"cell_by_role\": cell_by_role,\n\
          \                \"anchor_cell_ids\": anchor_cell_ids,\n               \
          \ \"booster_cell_ids\": booster_cell_ids,\n                \"traffic_by_slot_cell\"\
          : traffic_by_slot_cell,\n                \"traffic_by_cell\": traffic_by_cell,\n\
          \                \"coverage_by_group\": coverage_by_group,\n           \
          \     \"transfer_by_source\": transfer_by_source,\n                \"power_by_model_state\"\
          : power_by_model_state,\n                \"restriction_by_cell\": restriction_by_cell,\n\
          \                \"rule_by_key\": rule_by_key,\n            },\n       \
          \     \"meta\": meta,\n        }\n\n        parse_message = (\n        \
          \    f\"解析成功：task={len(tasks)}, cell={len(cells)}, traffic={len(traffic)},\
          \ \"\n            f\"coverage={len(coverage)}, transfer={len(transfer)},\
          \ power={len(power)}, \"\n            f\"restriction={len(restrictions)},\
          \ rule={len(rules)}, slot_count={slot_count}\\n\"\n            f\"表头诊断：{json.dumps(diag,\
          \ ensure_ascii=False)}\\n\"\n            f\"slot_id修复：{json.dumps(fix_info,\
          \ ensure_ascii=False)}\"\n        )\n\n        return {\n            \"\
          data_json\": json.dumps(data, ensure_ascii=False),\n            \"parse\"\
