    - data:
        code: "import json\n\n\n# ============================================================\n\
          # 初始化代码节点\n# 输入: data_json（上一节点解析结果）\n# 输出: loop_index / slot_count / state_json\
          \ / result_rows_json / slot_summaries_text\n# ============================================================\n\
          \ndef main(data_json: str) -> dict:\n    try:\n        if not data_json:\n\
          \            raise ValueError(\"data_json 为空\")\n\n        data = json.loads(data_json)\n\
          \        normalized = data.get(\"normalized\", {})\n        tasks = normalized.get(\"\
          task\", [])\n        cells = normalized.get(\"cell\", [])\n\n        if\
          \ not tasks:\n            raise ValueError(\"normalized.task 为空，无法计算 slot_count\"\
          )\n        if not cells:\n            raise ValueError(\"normalized.cell\
          \ 为空，无法初始化小区状态\")\n\n        # ---------- 1. 动态计算 slot_count（不写死） ----------\n\
          \        # 优先用 slot_id 去重；slot_id 缺失时回退 start_ts；再兜底用行号\n        slot_keys\
          \ = set()\n        for idx, t in enumerate(tasks):\n            sid = t.get(\"\
          slot_id\")\n            sts = t.get(\"start_ts\")\n            if sid is\
          \ not None:\n                slot_keys.add((\"sid\", str(sid)))\n      \
          \      elif sts is not None:\n                slot_keys.add((\"ts\", int(sts)))\n\
          \            else:\n                slot_keys.add((\"idx\", idx))\n    \
          \    slot_count = len(slot_keys)\n\n        # ---------- 2. 初始化每个小区的状态 ----------\n\
          \        state = {}\n        for c in cells:\n            cid = c.get(\"\
          cell_id\")\n            if cid is None or str(cid).strip() == \"\":\n  \
          \              continue\n\n            init_state = c.get(\"initial_state\"\
          )\n            if not init_state:\n                init_state = \"KEEP_ACTIVE\"\
          \n            init_state = str(init_state).strip().upper()\n\n         \
          \   init_deep = c.get(\"initial_deep_slots\")\n            try:\n      \
          \          init_deep = int(init_deep) if init_deep is not None else 0\n\
          \            except Exception:\n                init_deep = 0\n        \
          \    if init_deep < 0:\n                init_deep = 0\n\n            state[str(cid)]\
          \ = {\n                \"cell_id\": str(cid),\n                \"state\"\
          : init_state,\n                \"last_state\": init_state,\n           \
          \     \"consecutive_deep_slots\": init_deep,\n            }\n\n        #\
          \ ---------- 3. 初始化循环与结果集合 ----------\n        loop_index = 0\n        result_rows\
          \ = []          # 结果集合，初始为空\n        slot_summaries_text = \"\"  # 摘要集合（文本），初始为空\n\
          \n        return {\n            \"loop_index\": loop_index,\n          \
          \  \"slot_count\": slot_count,\n            \"state_json\": json.dumps(state,\
          \ ensure_ascii=False),\n            \"result_rows_json\": json.dumps(result_rows,\
          \ ensure_ascii=False),\n            \"slot_summaries_text\": slot_summaries_text,\n\
          \        }\n\n    except Exception as e:\n        return {\n           \
          \ \"loop_index\": 0,\n            \"slot_count\": 0,\n            \"state_json\"\
          : json.dumps({}, ensure_ascii=False),\n            \"result_rows_json\"\
          : json.dumps([], ensure_ascii=False),\n            \"slot_summaries_text\"\
          : f\"初始化失败：{type(e).__name__}: {str(e)}\",\n        }"
        code_language: python3
        outputs:
          loop_index:
            children: null
            type: number
          result_rows_json:
            children: null
            type: string
          slot_count:
            children: null
            type: number
          slot_summaries_text:
            children: null
            type: string
          state_json:
            children: null
            type: string
