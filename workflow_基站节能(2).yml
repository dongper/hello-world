    - data:
        code: "import json\nfrom collections import defaultdict\n\n\n# ============================================================\n\
          # 风险校验节点（独立复核）\n# 输入: data_json, result_rows_json\n# 输出: risk_ok, validata_result_rows_json,\
          \ risk_detail, risk_summary\n# ============================================================\n\
          \n\ndef _f(v, d=0.0):\n    try:\n        if v is None or v == \"\":\n  \
          \          return d\n        return float(v)\n    except Exception:\n  \
          \      return d\n\n\ndef _i(v, d=0):\n    try:\n        if v is None or\
          \ v == \"\":\n            return d\n        return int(float(v))\n    except\
          \ Exception:\n        return d\n\n\ndef _rule_val(rule_by_key, key, default):\n\
          \    r = rule_by_key.get(key)\n    if not r:\n        return default\n \
          \   v = r.get(\"value\")\n    return default if v is None else v\n\n\ndef\
          \ _within(a, b, tol=0.02):\n    return abs(a - b) <= tol\n\n\ndef _get_power(power_by_model_state,\
          \ model_id, state):\n    p = power_by_model_state.get(f\"{model_id}|{state}\"\
          )\n    if p is None:\n        return {\"capacity_units\": 0.0, \"base_power_w\"\
          : 0.0, \"slope_w_per_unit\": 0.0, \"_missing\": True}\n    return p\n\n\n\
          def main(data_json: str, result_rows_json: str) -> dict:\n    try:\n   \
          \     data = json.loads(data_json) if data_json else {}\n        rows =\
          \ json.loads(result_rows_json) if result_rows_json else []\n\n        normalized\
          \ = data.get(\"normalized\", {})\n        index = data.get(\"index\", {})\n\
          \n        tasks = normalized.get(\"task\", [])\n        cells = normalized.get(\"\
          cell\", [])\n        coverage = normalized.get(\"coverage\", [])\n     \
          \   restrictions = normalized.get(\"restriction\", [])\n\n        transfer_by_source\
          \ = index.get(\"transfer_by_source\", {})\n        power_by_model_state\
          \ = index.get(\"power_by_model_state\", {})\n        restriction_by_cell\
          \ = index.get(\"restriction_by_cell\", {})\n        rule_by_key = index.get(\"\
          rule_by_key\", {})\n\n        deep_load_ratio_max = _f(_rule_val(rule_by_key,\
          \ \"deep_load_ratio_max\", 0.2), 0.2)\n        light_load_ratio_max = _f(_rule_val(rule_by_key,\
          \ \"light_load_ratio_max\", 0.55), 0.55)\n        max_util = _f(_rule_val(rule_by_key,\
          \ \"max_utilization_ratio\", 0.85), 0.85)\n        max_consec = _i(_rule_val(rule_by_key,\
          \ \"max_consecutive_deep_slots\", 2), 2)\n        switch_wh = _f(_rule_val(rule_by_key,\
          \ \"switch_energy_wh\", 8), 8.0)\n        min_saving = _f(_rule_val(rule_by_key,\
          \ \"minimum_incremental_saving_wh\", 5), 5.0)\n\n        # ---------- 时段顺序与时刻映射\
          \ ----------\n        sorted_tasks = sorted(tasks, key=lambda x: x.get(\"\
          start_ts\") or 0)\n        slot_order = [str(t.get(\"slot_id\")) for t in\
          \ sorted_tasks]\n        slot_start_ts = {str(t.get(\"slot_id\")): (t.get(\"\
          start_ts\") or 0) for t in tasks}\n        slot_end_ts = {str(t.get(\"slot_id\"\
          )): (t.get(\"end_ts\") or 0) for t in tasks}\n        cell_ids_sorted =\
          \ sorted([str(c.get(\"cell_id\")) for c in cells])\n\n        # ----------\
          \ 1. 覆盖完整性 ----------\n        expected_keys = set()\n        for sid in\
          \ slot_order:\n            for cid in cell_ids_sorted:\n               \
          \ expected_keys.add((sid, cid))\n\n        row_by_key = {}\n        actual_keys\
          \ = []\n        dup_keys = []\n        for r in rows:\n            sid =\
          \ str(r.get(\"slot_id\"))\n            cid = str(r.get(\"cell_id\"))\n \
          \           actual_keys.append((sid, cid))\n            if (sid, cid) in\
          \ row_by_key:\n                dup_keys.append((sid, cid))\n           \
          \ else:\n                row_by_key[(sid, cid)] = r\n\n        actual_key_set\
          \ = set(actual_keys)\n        missing_keys = expected_keys - actual_key_set\n\
          \        extra_keys = actual_key_set - expected_keys\n\n        # ----------\
          \ 2. 排序 ----------\n        order_ok = True\n        prev_k = None\n   \
          \     for r in rows:\n            k = (slot_start_ts.get(str(r.get(\"slot_id\"\
          )), 0), str(r.get(\"cell_id\")))\n            if prev_k is not None and\
          \ k < prev_k:\n                order_ok = False\n                break\n\
          \            prev_k = k\n\n        structure_issues = []\n        if dup_keys:\n\
          \            structure_issues.append(\n                f\"存在重复记录 {len(dup_keys)}\
          \ 条，示例：{sorted(set(dup_keys))[:5]}\"\n            )\n        if missing_keys:\n\
