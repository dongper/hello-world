    - data:
        code: "import json\nimport re\n\n\nACTION_ORDER = [\"CREATE\", \"MERGE\",\
          \ \"MANUAL_REVIEW\", \"NO_TICKET\"]\n\nINTENT_ORDER = [\n    \"BILLING_DISPUTE\"\
          ,\n    \"MOBILE_NETWORK\",\n    \"BROADBAND_FAULT\",\n    \"INSTALL_DELAY\"\
          ,\n    \"SERVICE_ATTITUDE\",\n    \"POSITIVE_FEEDBACK\",\n]\n\n\ndef _s(value):\n\
          \    if value is None:\n        return \"\"\n    return str(value).strip()\n\
          \n\ndef _as_list(value):\n    if isinstance(value, list):\n        return\
          \ value\n    if isinstance(value, str) and value.strip():\n        try:\n\
          \            obj = json.loads(value)\n            return obj if isinstance(obj,\
          \ list) else []\n        except Exception:\n            return []\n    return\
          \ []\n\n\ndef _extract_json(text):\n    if isinstance(text, dict):\n   \
          \     return text\n    s = _s(text)\n    if not s:\n        return {}\n\n\
          \    s2 = re.sub(r\"^```(?:json)?\\s*\", \"\", s, flags=re.I)\n    s2 =\
          \ re.sub(r\"\\s*```$\", \"\", s2)\n    try:\n        obj = json.loads(s2)\n\
          \        return obj if isinstance(obj, dict) else {}\n    except Exception:\n\
          \        pass\n\n    m = re.search(r\"\\{.*\\}\", s, flags=re.S)\n    if\
          \ m:\n        try:\n            obj = json.loads(m.group(0))\n         \
          \   return obj if isinstance(obj, dict) else {}\n        except Exception:\n\
          \            pass\n    return {}\n\n\ndef _collect_items(rows_input):\n\
          \    rows = []\n    for raw in _as_list(rows_input):\n        if isinstance(raw,\
          \ dict):\n            obj = raw\n        else:\n            obj = _extract_json(raw)\n\
          \        if isinstance(obj, dict) and obj:\n            rows.append(obj)\n\
          \    return rows\n\n\ndef _summary_action_counts(summary_json):\n    summary\
          \ = _extract_json(summary_json)\n    counts = summary.get(\"action_counts\"\
          ) if isinstance(summary, dict) else None\n    result = {}\n    if isinstance(counts,\
          \ dict):\n        for a in ACTION_ORDER:\n            try:\n           \
          \     result[a] = int(counts.get(a, 0) or 0)\n            except Exception:\n\
          \                result[a] = 0\n    return result\n\n\ndef main(\n    summary_json:\
          \ str = \"\",\n    case_results=None,\n    case_item=None,\n    **kwargs\n\
          ):\n    # 兼容 Dify 输入变量名：优先 case_results，其次 case_item\n    rows_input = case_results\n\
          \    if rows_input is None:\n        rows_input = case_item\n    if rows_input\
          \ is None:\n        # 兜底：从 kwargs 中找可能的名称\n        for key in (\"case_result\"\
          , \"results\", \"items\", \"data\"):\n            if key in kwargs:\n  \
          \              rows_input = kwargs[key]\n                break\n\n    rows\
          \ = _collect_items(rows_input)\n\n    # 一、工单动作分布：[{category, value}, ...]\n\
          \    action_counts = _summary_action_counts(summary_json)\n    if not action_counts\
          \ or all(v == 0 for v in action_counts.values()):\n        action_counts\
          \ = {a: 0 for a in ACTION_ORDER}\n        for r in rows:\n            a\
          \ = _s(r.get(\"ticket_action\"))\n            if a in action_counts:\n \
          \               action_counts[a] += 1\n\n    action_data = [\n        {\"\
          category\": a, \"value\": int(action_counts.get(a, 0))}\n        for a in\
          \ ACTION_ORDER\n    ]\n\n    # 二、主意图分布：只统计主意图，不统计副意图\n    intent_counts\
          \ = {i: 0 for i in INTENT_ORDER}\n    for r in rows:\n        primary =\
          \ _s(r.get(\"primary_intent\"))\n        if primary in intent_counts:\n\
          \            intent_counts[primary] += 1\n\n    intent_data = [\n      \
          \  {\"category\": i, \"value\": int(intent_counts[i])}\n        for i in\
          \ INTENT_ORDER\n    ]\n\n    return {\n        \"action_chart_data_json\"\
          : json.dumps(action_data, ensure_ascii=False),\n        \"intent_chart_data_json\"\
          : json.dumps(intent_data, ensure_ascii=False),\n    }"
