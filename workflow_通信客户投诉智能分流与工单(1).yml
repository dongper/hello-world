    - data:
        code: "import json\nfrom collections import defaultdict\nfrom datetime import\
          \ datetime\n\n\nLEVEL_MAP = {\n    \"普通客户\": \"normal\",\n    \"VIP客户\"\
          : \"vip\",\n    \"企业客户\": \"enterprise\",\n    \"normal\": \"normal\",\n\
          \    \"vip\": \"vip\",\n    \"enterprise\": \"enterprise\",\n}\n\n\ndef\
          \ _clean_fieldname(name):\n    if name is None:\n        return \"\"\n \
          \   return str(name).strip().lstrip(\"\\ufeff\")\n\n\ndef _is_empty_row(row):\n\
          \    return all(str(v).strip() == \"\" for v in row.values())\n\n\ndef _check_type(value,\
          \ checker_name):\n    s = str(value).strip()\n    if checker_name == \"\
          time\":\n        dt = datetime.fromisoformat(s)\n        if dt.tzinfo is\
          \ None:\n            raise ValueError(\"时间缺少时区\")\n    elif checker_name\
          \ == \"number\":\n        float(s)\n    elif checker_name == \"int\":\n\
          \        int(float(s))\n    elif checker_name == \"service_type\":\n   \
          \     if s not in (\"MOBILE\", \"BROADBAND\"):\n            raise ValueError(\"\
          service_type 必须为 MOBILE/BROADBAND\")\n    elif checker_name == \"rule_service_type\"\
          :\n        if s not in (\"MOBILE\", \"BROADBAND\", \"ANY\"):\n         \
          \   raise ValueError(\"规则表 service_type 必须为 MOBILE/BROADBAND/ANY\")\n  \
          \  else:\n        raise ValueError(f\"未知类型检查器: {checker_name}\")\n\n\ndef\
          \ _split_md_row(line):\n    s = str(line).strip()\n    if s.startswith(\"\
          |\"):\n        s = s[1:]\n    if s.endswith(\"|\"):\n        s = s[:-1]\n\
          \    return [c.strip() for c in s.split(\"|\")]\n\n\ndef _is_separator_row(cells):\n\
          \    if not cells:\n        return False\n    has_dash = False\n    for\
          \ c in cells:\n        if c == \"\":\n            continue\n        if not\
          \ all(ch in \"-: \" for ch in c):\n            return False\n        if\
          \ \"-\" in c:\n            has_dash = True\n    return has_dash\n\n\ndef\
          \ _parse_table(text, table_name, required_cols, key_col, type_checks=None):\n\
          \    errors = []\n\n    if text is None or str(text).strip() == \"\":\n\
          \        return [], [f\"{table_name}: 输入为空，无法解析\"]\n\n    try:\n       \
          \ raw_lines = str(text).replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\
          \\n\").split(\"\\n\")\n        lines = [ln for ln in raw_lines if ln.strip()\
          \ != \"\"]\n        if not lines:\n            return [], [f\"{table_name}:\
          \ 无有效行\"]\n\n        header_cells = [_clean_fieldname(c) for c in _split_md_row(lines[0])]\n\
          \        missing_cols = [c for c in required_cols if c not in header_cells]\n\
          \        if missing_cols:\n            return [], [f\"{table_name}: 缺少必要列\
          \ {missing_cols}\"]\n\n        start_idx = 1\n        if len(lines) > 1\
          \ and _is_separator_row(_split_md_row(lines[1])):\n            start_idx\
          \ = 2\n\n        rows = []\n        for line in lines[start_idx:]:\n   \
          \         cells = _split_md_row(line)\n            if len(cells) < len(header_cells):\n\
          \                cells = cells + [\"\"] * (len(header_cells) - len(cells))\n\
          \            elif len(cells) > len(header_cells):\n                cells\
          \ = cells[:len(header_cells)]\n\n            row = {h: (\"\" if v is None\
          \ else str(v)) for h, v in zip(header_cells, cells)}\n            if _is_empty_row(row):\n\
          \                continue\n            rows.append(row)\n\n        seen_keys\
          \ = {}\n        for idx, row in enumerate(rows, start=2):\n            key_value\
          \ = row.get(key_col, \"\")\n            if key_value == \"\":\n        \
          \        errors.append(f\"{table_name}: 第{idx}行主键 {key_col} 为空\")\n    \
          \        elif key_value in seen_keys:\n                errors.append(\n\
          \                    f\"{table_name}: 主键 {key_col}={key_value} 重复，\"\n \
          \                   f\"首次行{seen_keys[key_value]}，再次行{idx}\"\n          \
          \      )\n            else:\n                seen_keys[key_value] = idx\n\
          \n        type_checks = type_checks or {}\n        for row in rows:\n  \
          \          row_key = row.get(key_col, \"?\")\n            for col, checker_name\
          \ in type_checks.items():\n                value = row.get(col, \"\")\n\
          \                if value == \"\":\n                    continue\n     \
          \           if str(value).strip().upper() == \"UNKNOWN\":\n            \
          \        continue\n                try:\n                    _check_type(value,\
          \ checker_name)\n                except Exception:\n                   \
          \ errors.append(\n                        f\"{table_name}: {row_key} 字段\
          \ {col} 类型错误，值为 {value!r}\"\n                    )\n\n        return rows,\
          \ errors\n\n    except Exception as e:\n        return [], [f\"{table_name}:\
          \ 解析异常 {str(e)}\"]\n\n\ndef _get_level_code(level):\n    return LEVEL_MAP.get(str(level).strip(),\
          \ \"unknown\")\n\n\ndef main(\n    case_csv: str,\n    service_csv: str,\n\
          \    rule_csv: str,\n    ticket_csv: str,\n    custome_csv: str,\n):\n \
          \   all_errors = []\n\n    case_required = [\n        \"case_id\", \"received_at\"\
          , \"channel\", \"customer_id\", \"service_id\",\n        \"service_type\"\
          , \"region\", \"complaint_text\"\n    ]\n    service_required = [\n    \
          \    \"service_id\", \"customer_id\", \"service_type\", \"region\", \"snapshot_at\"\
          ,\n        \"account_status\", \"bill_cycle\", \"contract_monthly_fee_yuan\"\
          ,\n        \"charged_monthly_fee_yuan\", \"network_incident_status\",\n\
          \        \"access_line_status\", \"install_order_id\", \"install_order_status\"\
          ,\n        \"planned_complete_at\", \"evidence_id\"\n    ]\n    rule_required\
          \ = [\n        \"rule_id\", \"intent_code\", \"service_type\", \"verification_result\"\
          ,\n        \"required_fields\", \"queue_id\", \"precedence\", \"priority_normal\"\
          ,\n        \"priority_vip\", \"priority_enterprise\", \"sla_hours_normal\"\
          ,\n        \"sla_hours_vip\", \"sla_hours_enterprise\", \"ticket_action\"\
          \n    ]\n    ticket_required = [\n        \"ticket_id\", \"customer_id\"\
          , \"service_id\", \"intent_code\", \"status\",\n        \"created_at\",\
          \ \"last_updated_at\", \"owner_queue\"\n    ]\n    customer_required = [\n\
          \        \"customer_id\", \"customer_name\", \"customer_level\"\n    ]\n\
          \n    case_rows, e1 = _parse_table(\n        case_csv, \"01_待处理新诉求\", case_required,\
          \ \"case_id\",\n        {\"received_at\": \"time\", \"service_type\": \"\
          service_type\"},\n    )\n    service_rows, e2 = _parse_table(\n        service_csv,\
          \ \"02_业务核验快照\", service_required, \"service_id\",\n        {\n        \
          \    \"snapshot_at\": \"time\",\n            \"contract_monthly_fee_yuan\"\
          : \"number\",\n            \"charged_monthly_fee_yuan\": \"number\",\n \
          \           \"planned_complete_at\": \"time\",\n        },\n    )\n    rule_rows,\
          \ e3 = _parse_table(\n        rule_csv, \"03_分流与时限规则\", rule_required, \"\
          rule_id\",\n        {\n            \"service_type\": \"rule_service_type\"\
          ,\n            \"precedence\": \"int\",\n            \"sla_hours_normal\"\
          : \"number\",\n            \"sla_hours_vip\": \"number\",\n            \"\
          sla_hours_enterprise\": \"number\",\n        },\n    )\n    ticket_rows,\
          \ e4 = _parse_table(\n        ticket_csv, \"04_在途与历史工单\", ticket_required,\
          \ \"ticket_id\",\n        {\"created_at\": \"time\", \"last_updated_at\"\
          : \"time\"},\n    )\n    customer_rows, e5 = _parse_table(\n        custome_csv,\
          \ \"customer_info\", customer_required, \"customer_id\",\n    )\n\n    all_errors.extend(e1\
          \ + e2 + e3 + e4 + e5)\n    parse_ok = len(all_errors) == 0\n\n    customers_clean\
          \ = []\n    for row in customer_rows:\n        item = dict(row)\n      \
          \  item.pop(\"source_row_index\", None)\n        customers_clean.append(item)\n\
          \n    case_items = []\n\n    if parse_ok:\n        customers_by_id = {}\n\
          \        for row in customers_clean:\n            customers_by_id[row.get(\"\
          customer_id\", \"\")] = row\n\n        snapshots_by_key = defaultdict(list)\n\
          \        for row in service_rows:\n            key = (\n               \
          \ row.get(\"customer_id\", \"\"),\n                row.get(\"service_type\"\
          , \"\"),\n                row.get(\"region\", \"\"),\n            )\n  \
          \          snapshots_by_key[key].append(dict(row))\n\n        tickets_by_customer_service\
          \ = defaultdict(list)\n        for row in ticket_rows:\n            key\
          \ = (row.get(\"customer_id\", \"\"), row.get(\"service_id\", \"\"))\n  \
          \          tickets_by_customer_service[key].append(dict(row))\n\n      \
          \  rules_by_service_type = defaultdict(list)\n        for row in rule_rows:\n\
          \            st = row.get(\"service_type\", \"\")\n            if st in\
          \ (\"MOBILE\", \"BROADBAND\", \"ANY\"):\n                rules_by_service_type[st].append(dict(row))\n\
          \n        for case in case_rows:\n            item = dict(case)\n\n    \
          \        customer_id = case.get(\"customer_id\", \"\")\n            service_id\
          \ = case.get(\"service_id\", \"\")\n            service_type = case.get(\"\
          service_type\", \"\")\n            region = case.get(\"region\", \"\")\n\
          \n            # 客户关键信息\n            customer = customers_by_id.get(customer_id)\n\
          \            if customer:\n                item[\"customer_info\"] = {\n\
          \                    \"customer_name\": customer.get(\"customer_name\",\
          \ \"\"),\n                    \"customer_level\": customer.get(\"customer_level\"\
          , \"\"),\n                    \"customer_level_code\": _get_level_code(\n\
          \                        customer.get(\"customer_level\", \"\")\n      \
          \              ),\n                }\n            else:\n              \
          \  item[\"customer_info\"] = None\n\n            # 快照：customer_id + service_type\
          \ + region 三字段匹配\n            snapshot_candidates = snapshots_by_key.get(\n\
          \                (customer_id, service_type, region), []\n            )\n\
          \            item[\"snapshot\"] = snapshot_candidates[0] if snapshot_candidates\
          \ else None\n\n            # 工单候选：同客户同业务号\n            item[\"ticket_candidates\"\
          ] = [\n                dict(t) for t in tickets_by_customer_service.get(\n\
          \                    (customer_id, service_id), []\n                )\n\
          \            ]\n\n            # 规则候选：诉求 service_type 与 ANY\n           \
          \ rule_candidates = []\n            seen_rule_ids = set()\n            for\
          \ rule in (\n                rules_by_service_type.get(service_type, [])\n\
          \                + rules_by_service_type.get(\"ANY\", [])\n            ):\n\
          \                rid = rule.get(\"rule_id\", \"\")\n                if rid\
          \ not in seen_rule_ids:\n                    seen_rule_ids.add(rid)\n  \
          \                  rule_candidates.append(rule)\n            item[\"rule_candidates\"\
          ] = rule_candidates\n\n            case_items.append(item)\n\n    if parse_ok:\n\
          \        parse_message = (\n            \"五张表解析成功：\"\n            f\"cases={len(case_rows)},\
          \ services={len(service_rows)}, \"\n            f\"rules={len(rule_rows)},\
          \ tickets={len(ticket_rows)}, \"\n            f\"customers={len(customers_clean)}；\"\
          \n            f\"已生成 case_item {len(case_items)} 条。\"\n        )\n    else:\n\
          \        preview = all_errors[:20]\n        parse_message = (\n        \
          \    f\"五张表解析失败，共 {len(all_errors)} 个结构/主键/类型错误。\"\n            + \"；\"\
          .join(preview)\n        )\n        if len(all_errors) > 20:\n          \
          \  parse_message += \"；……其余错误略。\"\n\n    result = {\n        \"parse\":\
          \ parse_ok,\n        \"parse_message\": parse_message,\n        \"tables\"\
          : {\n            \"cases\": case_rows,\n            \"services\": service_rows,\n\
          \            \"rules\": rule_rows,\n            \"tickets\": ticket_rows,\n\
          \            \"customers\": customers_clean,\n        },\n        \"stats\"\
          : {\n            \"cases\": len(case_rows),\n            \"services\": len(service_rows),\n\
          \            \"rules\": len(rule_rows),\n            \"tickets\": len(ticket_rows),\n\
          \            \"customers\": len(customers_clean),\n            \"case_items\"\
          : len(case_items),\n        },\n        \"errors\": all_errors,\n      \
          \  \"case_items\": case_items,\n    }\n\n    return {\n        \"data_json\"\
          : json.dumps(result, ensure_ascii=False),\n        \"parse\": parse_ok,\n\
          \        \"parse_message\": parse_message,\n        \"case_item\": case_items,\n\
          \    }"
