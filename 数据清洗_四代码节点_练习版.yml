    - data:
        code: "import base64\nimport json\nimport zlib\n\n\ndef pack(value):\n    raw = json.dumps(value, ensure_ascii=False,\
          \ separators=(\",\", \":\")).encode(\"utf-8\")\n    return base64.b64encode(zlib.compress(raw, 9)).decode(\"ascii\"\
          )\n\n\ndef unpack(value):\n    return json.loads(zlib.decompress(base64.b64decode(value)).decode(\"utf-8\"))\n\n\
          \ndef blank(value):\n    return value is None or str(value).strip() == \"\"\n\n\nimport re\n\n\nID_FIELDS = {\"\
          complaint_id\": (\"TS\", 10), \"customer_id\": (\"CUST\", 4), \"handler_id\": (\"EMP\", 4), \"hall_id\": (\"HALL\"\
          , 3)}\nCHINESE = {\"complaint_id\": \"投诉单\", \"customer_id\": \"客户\", \"handler_id\": \"员工\", \"hall_id\": \"营业厅\"\
          }\n\n\ndef complaint_prefix(tables):\n    counts = {}\n    for name in (\"record\", \"handling\"):\n        for\
          \ row in tables[name][\"rows\"]:\n            m = re.fullmatch(r\"(?i)TS(\\d{6})\\d{4}\", str(row.get(\"complaint_id\"\
          , \"\")).strip())\n            if m:\n                counts[m.group(1)] = counts.get(m.group(1), 0) + 1\n    if\
          \ not counts:\n        return None\n    ordered = sorted(counts.items(), key=lambda x: (-x[1], x[0]))\n    return\
          \ ordered[0][0] if len(ordered) == 1 or ordered[0][1] > ordered[1][1] else None\n\n\ndef fix_id(value, field, prefix_month):\n\
          \    if blank(value):\n        return value, False, \"\"\n    raw = str(value).strip()\n    prefix, width = ID_FIELDS[field]\n\
          \    if re.fullmatch(prefix + r\"\\d{%d}\" % width, raw):\n        return value, False, \"\"\n    chinese = re.fullmatch(CHINESE[field]\
          \ + r\"\\s*(\\d+)\", raw)\n    if chinese:\n        number = int(chinese.group(1)) - 1\n        if number < 0:\n\
          \            return \"\", False, \"中文序号小于 1：\" + raw\n        digits = str(number)\n    else:\n        m = re.fullmatch(r\"\
          (?i)\" + prefix + r\"\\s*(\\d+)\", raw)\n        digits = m.group(1) if m else (raw if raw.isdigit() else None)\n\
          \    if digits is None:\n        return \"\", False, \"无法解释 ID：\" + raw\n    if field == \"complaint_id\":\n   \
          \     if len(digits) == 10:\n            result = \"TS\" + digits\n        elif len(digits) <= 4 and prefix_month\
          \ is not None:\n            result = \"TS\" + prefix_month + digits.zfill(4)\n        else:\n            return\
          \ \"\", False, \"投诉号数字含义不唯一：\" + raw\n    else:\n        if len(digits) > width:\n            return \"\", False,\
          \ \"ID 位数超限：\" + raw\n        result = prefix + digits.zfill(width)\n    return result, result != value, \"\"\n\n\
          \ndef main(record, handling, customer, employee, hall, stats):\n    tables = {name: unpack(value) for name, value\
          \ in ((\"record\", record), (\"handling\", handling), (\"customer\", customer), (\"employee\", employee), (\"hall\"\
          , hall))}\n    report = unpack(stats)\n    month = complaint_prefix(tables)\n    report[\"complaint_month_prefix\"\
          ] = month or \"未能唯一确定\"\n    report[\"id_repairs\"] = {}\n    report[\"id_issues\"] = []\n    for name, table in\
          \ tables.items():\n        count = 0\n        for row in table[\"rows\"]:\n            for field in ID_FIELDS:\n\
          \                if field not in row:\n                    continue\n                fixed, changed, issue = fix_id(row[field],\
          \ field, month)\n                row[field] = fixed\n                count += int(changed)\n                if issue:\n\
          \                    report[\"id_issues\"].append({\"table\": name, \"source_row_index\": row[\"source_row_index\"\
          ], \"field\": field, \"issue\": issue})\n        report[\"id_repairs\"][name] = count\n    return {**{name: pack(table)\
          \ for name, table in tables.items()}, \"stats\": pack(report)}\n"
