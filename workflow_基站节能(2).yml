    - data:
        code: "import json\nimport csv\nimport io\nimport re\nfrom datetime import\
          \ datetime, timezone, timedelta\n\n\n# ============================================================\n\
          # 1. 工具函数\n# ============================================================\n\
          \ndef clean_text(text):\n    if text is None:\n        return \"\"\n   \
          \ s = str(text)\n    s = s.replace(\"\\ufeff\", \"\").replace(\"\\r\\n\"\
          , \"\\n\").replace(\"\\r\", \"\\n\").strip()\n    lines = s.split(\"\\n\"\
          )\n    if lines and lines[0].strip().startswith(\"```\"):\n        lines\
          \ = lines[1:]\n    if lines and lines[-1].strip().startswith(\"```\"):\n\
          \        lines = lines[:-1]\n    return \"\\n\".join(lines).strip()\n\n\n\
          def is_md_sep_row(line):\n    s = line.strip()\n    if \"|\" not in s:\n\
          \        return False\n    cells = [c.strip() for c in s.strip(\"|\").split(\"\
          |\")]\n    non_blank = [c for c in cells if c]\n    if len(non_blank) <\
          \ 2:\n        return False\n    for c in non_blank:\n        if not re.fullmatch(r\"\
          :?-+:?\", c):\n            return False\n    return True\n\n\ndef split_md_row(line):\n\
          \    s = line.strip()\n    if s.startswith(\"|\"):\n        s = s[1:]\n\
          \    if s.endswith(\"|\"):\n        s = s[:-1]\n    return [c.strip() for\
          \ c in s.split(\"|\")]\n\n\ndef normalize_header(h):\n    return (str(h).strip()\n\
          \            .replace(\"\\ufeff\", \"\")\n            .replace(\" \", \"\
          \")\n            .replace(\"_\", \"\")\n            .replace(\"-\", \"\"\
          )\n            .replace(\".\", \"\")\n            .lower())\n\n\n# 表头别名\n\
          HEADER_ALIASES = {\n    \"slot\": \"slot_id\", \"slotid\": \"slot_id\",\
          \ \"slotno\": \"slot_id\",\n    \"slotseq\": \"slot_id\", \"slotindex\"\
          : \"slot_id\",\n    \"period\": \"slot_id\", \"periodid\": \"slot_id\",\
          \ \"periodno\": \"slot_id\",\n    \"timeslot\": \"slot_id\", \"timeslotid\"\
          : \"slot_id\", \"timeslotno\": \"slot_id\",\n    \"seq\": \"slot_id\", \"\
          index\": \"slot_id\", \"id\": \"slot_id\",\n    \"时段\": \"slot_id\", \"\
          时段id\": \"slot_id\", \"时段序号\": \"slot_id\",\n    \"时段编号\": \"slot_id\",\
          \ \"时间片\": \"slot_id\", \"时间片序号\": \"slot_id\",\n    \"序号\": \"slot_id\"\
