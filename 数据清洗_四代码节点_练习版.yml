    - data:
        code: "import base64\nimport json\nimport zlib\n\n\ndef pack(value):\n    raw = json.dumps(value, ensure_ascii=False,\
          \ separators=(\",\", \":\")).encode(\"utf-8\")\n    return base64.b64encode(zlib.compress(raw, 9)).decode(\"ascii\"\
          )\n\n\ndef unpack(value):\n    return json.loads(zlib.decompress(base64.b64decode(value)).decode(\"utf-8\"))\n\n\
          \ndef blank(value):\n    return value is None or str(value).strip() == \"\"\n\n\nimport datetime as dt\nimport re\n\
          \n\nFORMATS = [\"%Y/%m/%d %H:%M:%S\", \"%Y/%m/%d %H:%M\", \"%Y/%m/%d\", \"%d-%m-%Y %H:%M:%S\", \"%d-%m-%Y %H:%M\"\
          , \"%d-%m-%Y\", \"%H:%M %d-%m-%Y\", \"%Y-%m-%d %H:%M:%S\", \"%Y-%m-%d %H:%M\", \"%Y-%m-%d\", \"%Y.%m.%d %H:%M:%S\"\
          , \"%Y.%m.%d %H:%M\", \"%Y.%m.%d\", \"%Y年%m月%d日 %H:%M:%S\", \"%Y年%m月%d日 %H:%M\", \"%Y年%m月%d日\", \"%A, %d %B %Y %I:%M\
          \ %p\", \"%a, %d %b %Y %I:%M %p\", \"%m/%d/%Y %I:%M %p\", \"%m/%d/%Y %H:%M\", \"%Y%m%d%H%M%S\", \"%Y%m%d%H%M\",\
          \ \"%Y%m%d\"]\n\n\ndef normalize_time(value):\n    if blank(value):\n        return \"\", False, \"空白时间\"\n    s\
          \ = str(value).strip()\n    # 斜杠月/日/年在月、日都不超过 12 时有歧义，不能猜测。\n    m = re.fullmatch(r\"(\\d{1,2})/(\\d{1,2})/(\\d{4})(?:\\\
          s+.*)?\", s)\n    if m and not re.search(r\"\\b(?:AM|PM)\\b\", s, re.I) and int(m.group(1)) <= 12 and int(m.group(2))\
          \ <= 12:\n        return \"\", False, \"歧义时间：\" + s\n    for fmt in FORMATS:\n        try:\n            parsed =\
          \ dt.datetime.strptime(s, fmt)\n            result = parsed.strftime(\"%Y/%m/%d %H:%M\")\n            # 原始斜杠年/月/日格式仅补零、舍秒，不计修复数。\n\
          \            base = bool(re.fullmatch(r\"\\d{4}/\\d{1,2}/\\d{1,2}\\s+\\d{1,2}:\\d{2}(?::\\d{2})?\", s))\n      \
          \      return result, not base, \"\"\n        except ValueError:\n            pass\n    return \"\", False, \"无法识别时间：\"\
          \ + s\n\n\ndef main(record, handling, customer, employee, hall):\n    tables = {name: unpack(value) for name, value\
          \ in locals().copy().items() if name in (\"record\", \"handling\", \"customer\", \"employee\", \"hall\")}\n    stats\
          \ = {\"time_repairs\": {}, \"time_issues\": []}\n    for name in (\"record\", \"handling\"):\n        count = 0\n\
          \        for row in tables[name][\"rows\"]:\n            fixed, repaired, issue = normalize_time(row[\"accept_time\"\
          ])\n            row[\"accept_time\"] = fixed\n            count += int(repaired)\n            if issue:\n      \
          \          stats[\"time_issues\"].append({\"table\": name, \"source_row_index\": row[\"source_row_index\"], \"issue\"\
          : issue})\n        stats[\"time_repairs\"][name] = count\n    return {**{name: pack(table) for name, table in tables.items()},\
          \ \"stats\": pack(stats)}\n"
