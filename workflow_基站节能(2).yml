    - data:
        code: "import json\n\n\n# ============================================================\n\
          # 可视化数据准备节点（AntV 图表输入）\n# 输入: strategy_summary_json, validata_result_rows_json\n\
          # 输出:\n#   energy_chart_json    纯数组 → AntV 分组柱状图（能耗对比）\n#   strategy_chart_json\
          \  纯数组 → AntV 分组柱状图（策略数量）\n#   trend_chart_json     纯数组 → AntV 折线图（业务量趋势）\n\
          # 说明：\n#   柱状图元素 {category, value, group}\n#   折线图元素 {time, value, group}\n\
          #   group 字段自动生成图例\n# ============================================================\n\
          \n\ndef _f(v, d=0.0):\n    try:\n        if v is None or v == \"\":\n  \
          \          return d\n        return float(v)\n    except Exception:\n  \
          \      return d\n\n\ndef main(strategy_summary_json: str, validata_result_rows_json:\
          \ str) -> dict:\n    try:\n        rows = json.loads(validata_result_rows_json)\
          \ if validata_result_rows_json else []\n        if not isinstance(rows,\
          \ list):\n            rows = []\n\n        # ---------- 时段顺序 ----------\n\
          \        slot_order = []\n        seen = set()\n\n        # 优先从 strategy_summary_json\
          \ 中提取已排序的时段\n        try:\n            summary = json.loads(strategy_summary_json)\
          \ if strategy_summary_json else {}\n            if isinstance(summary, dict):\n\
          \                sc = summary.get(\"slot_strategy_chart\", {}).get(\"data\"\
          , [])\n                for item in sc:\n                    s = str(item.get(\"\
          slot\", \"\"))\n                    if s and s not in seen:\n          \
          \              seen.add(s)\n                        slot_order.append(s)\n\
          \        except Exception:\n            pass\n\n        # 兜底：按出现顺序\n   \
          \     if not slot_order:\n            for r in rows:\n                sid\
          \ = str(r.get(\"slot_id\"))\n                if sid not in seen:\n     \
          \               seen.add(sid)\n                    slot_order.append(sid)\n\
          \n        # ============================================================\n\
          \        # 图1：分时段基准能耗与策略能耗对比（分组柱状图）\n        # 元素格式：{category, value, group}\n\
          \        # ============================================================\n\
          \        energy_data = []\n        for sid in slot_order:\n            slot_rows\
          \ = [r for r in rows if str(r.get(\"slot_id\")) == sid]\n            base\
          \ = sum(_f(r.get(\"base_energy_wh\"), 0) for r in slot_rows)\n         \
          \   strat = sum(_f(r.get(\"strategy_energy_wh\"), 0) for r in slot_rows)\n\
          \            energy_data.append({\n                \"category\": sid,\n\
          \                \"value\": round(base, 2),\n                \"group\":\
          \ \"基准能耗\",\n            })\n            energy_data.append({\n        \
          \        \"category\": sid,\n                \"value\": round(strat, 2),\n\
          \                \"group\": \"策略能耗\",\n            })\n\n        # ============================================================\n\
          \        # 图2：分时段节能策略数量分布（分组柱状图）\n        # 元素格式：{category, value, group}\n\
          \        # ============================================================\n\
          \        strategy_data = []\n        for sid in slot_order:\n          \
          \  slot_rows = [r for r in rows if str(r.get(\"slot_id\")) == sid]\n   \
          \         k = sum(1 for r in slot_rows if str(r.get(\"state\", \"\")).upper()\
          \ == \"KEEP_ACTIVE\")\n            l = sum(1 for r in slot_rows if str(r.get(\"\
          state\", \"\")).upper() == \"LIGHT_SLEEP\")\n            d = sum(1 for r\
          \ in slot_rows if str(r.get(\"state\", \"\")).upper() == \"DEEP_SLEEP\"\
          )\n            strategy_data.append({\"category\": sid, \"value\": k, \"\
          group\": \"保持运行\"})\n            strategy_data.append({\"category\": sid,\
          \ \"value\": l, \"group\": \"轻载节能\"})\n            strategy_data.append({\"\
          category\": sid, \"value\": d, \"group\": \"深度休眠\"})\n\n        # ============================================================\n\
          \        # 图3：小区最终业务量趋势（折线图）\n        # 元素格式：{time, value, group}\n    \
          \    # ============================================================\n  \
          \      cell_ids = sorted({str(r.get(\"cell_id\")) for r in rows})\n    \
          \    value_index = {}\n        for r in rows:\n            key = (str(r.get(\"\
          slot_id\")), str(r.get(\"cell_id\")))\n            value_index[key] = round(_f(r.get(\"\
          final_traffic\"), 0), 2)\n\n        trend_data = []\n        for sid in\
          \ slot_order:\n            for cid in cell_ids:\n                v = value_index.get((sid,\
          \ cid))\n                if v is None:\n                    continue\n \
          \               trend_data.append({\n                    \"time\": sid,\n\
          \                    \"value\": v,\n                    \"group\": cid,\n\
          \                })\n\n        return {\n            \"energy_chart_json\"\
          : json.dumps(energy_data, ensure_ascii=False),\n            \"strategy_chart_json\"\
          : json.dumps(strategy_data, ensure_ascii=False),\n            \"trend_chart_json\"\
          : json.dumps(trend_data, ensure_ascii=False),\n        }\n\n    except Exception:\n\
          \        empty = json.dumps([], ensure_ascii=False)\n        return {\n\
          \            \"energy_chart_json\": empty,\n            \"strategy_chart_json\"\
          : empty,\n            \"trend_chart_json\": empty,\n        }"
        code_language: python3
        outputs:
          energy_chart_json:
            children: null
            type: string
          strategy_chart_json:
            children: null
            type: string
          trend_chart_json:
            children: null
            type: string
        selected: false
        title: 可视化代码准备
        type: code
        variables:
